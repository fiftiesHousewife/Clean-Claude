# PMD's type-resolution recursion blows the default stack on this codebase's
# more deeply chained method-call expressions; -Xss8m gives it room. -Xmx2g
# is what the dogfood self-apply needs to hold every module's analysis in
# memory at once. Both knobs apply to the daemon, which is where Gradle's
# Pmd worker runs by default (no-isolation mode).
org.gradle.jvmargs=-Xss8m -Xmx2g -Dfile.encoding=UTF-8
