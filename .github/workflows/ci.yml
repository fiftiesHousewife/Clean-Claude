name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: |
            **/build/test-results/test/TEST-*.xml
            **/build/test-results/integrationTest/TEST-*.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  dogfood:
    # macos-latest matches the local dev OS so the SUMMARY/index baseline
    # stays byte-stable. Two ubuntu runs in this repo produced consistent
    # ±3-finding drift against macOS-baselined committed reports
    # (different JaCoCo bytecode introspection and Surefire timing). The
    # build job above stays on ubuntu — fast and cheap; only the
    # finding-aggregation job needs OS parity with local dev.
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Self-apply plugin and refresh docs/reports
        run: ./scripts/dogfood.sh

      - name: Fail if SUMMARY drifted
        run: |
          if ! git diff --exit-code -- docs/reports/SUMMARY.md docs/reports/index.html; then
            echo "::error::docs/reports/SUMMARY.md or index.html is out of sync with the current findings."
            echo "Run ./scripts/dogfood.sh locally and commit the result."
            exit 1
          fi

      - name: Upload dogfood report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-report
          path: docs/reports/
