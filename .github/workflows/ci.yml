name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: |
            **/build/test-results/test/TEST-*.xml
            **/build/test-results/integrationTest/TEST-*.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  dogfood:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Self-apply plugin and refresh docs/reports
        run: ./scripts/dogfood.sh

      - name: Fail if docs/reports/ drifted
        run: |
          if ! git diff --exit-code -- docs/reports/; then
            echo "::error::docs/reports/ is out of sync with the current findings."
            echo "Run ./scripts/dogfood.sh locally and commit the result."
            exit 1
          fi

      - name: Upload dogfood report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-report
          path: docs/reports/
